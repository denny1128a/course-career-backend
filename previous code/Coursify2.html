<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>智慧選課與生涯建議系統</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7fa;
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .chat-container {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      margin-top: 16px;
      display: block;
      color: #34495e;
    }

    select, textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
    }

    .response {
      margin-top: 30px;
      padding: 20px;
      background-color: #ecfdf5;
      border-left: 6px solid #2ecc71;
      border-radius: 12px;
      display: none;
    }

    .response h3 {
      margin-top: 0;
      color: #2c7a7b;
    }

    .field-group {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>智慧選課與生涯建議系統</h1>
  <div class="chat-container">
    
    <div class="field-group">
      <label for="department">請選擇你的主修學系：</label>
      <select id="department">
        <option value="">-- 請選擇 --</option>
        <option value="資訊工程學系">資訊工程學系</option>
        <option value="電機工程學系">電機工程學系</option>
        <option value="企業管理學系">企業管理學系</option>
        <option value="通訊工程學系">通訊工程學系</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div class="field-group">
      <label for="grade">年級：</label>
      <select id="grade">
        <option value="">-- 請選擇 --</option>
        <option value="一年級">一年級</option>
        <option value="二年級">二年級</option>
        <option value="三年級">三年級</option>
        <option value="四年級">四年級</option>
        <option value="研究生">研究生</option>
      </select>
    </div>

    <div class="field-group">
      <label for="takenCourses">已修課程（可列出幾門課）：</label>
      <input type="text" id="takenCourses" placeholder="例如：程式設計、線性代數...">
    </div>

    <div class="field-group">
      <label for="studentQuestion">其他補充或問題描述：</label>
      <textarea id="studentQuestion" placeholder="我對資料分析有興趣，想知道要補哪些能力..."></textarea>
    </div>

    <button onclick="getSuggestion()">送出問題</button>

    <div id="responseArea" class="response">
      <h3>課程建議</h3>
      <p id="courseAdvice"></p>
      <h3>生涯建議</h3>
      <p id="careerAdvice"></p>
    </div>
  </div>

  <script>
    function getSuggestion() {
      const dept = document.getElementById('department').value;
      const grade = document.getElementById('grade').value;
      const taken = document.getElementById('takenCourses').value;
      const question = document.getElementById('studentQuestion').value;

      const courseAdvice = `根據您是 ${grade} 的 ${dept} 學生，並已修過：${taken}，
建議您進一步選修「資料結構」、「人工智慧導論」、「資料科學概論」等課程，以建立AI與資料處理的基礎能力。`;

      const careerAdvice = `您提到：「${question}」
建議您可以多參與學校的研究計畫或競賽活動，例如大數據分析競賽、AI程式實作等。
同時關注相關實習機會，有助於未來銜接業界職涯。`;

      document.getElementById('courseAdvice').innerText = courseAdvice;
      document.getElementById('careerAdvice').innerText = careerAdvice;
      document.getElementById('responseArea').style.display = 'block';
    }
  </script>
</body>
</html>
