<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Coursify - 智慧選課與生涯建議</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

    body {
      font-family: 'Noto Sans TC', Arial, sans-serif;
      background-color: #f4f7fa;
      padding: 0;
      max-width: 900px;
      margin: 40px auto;
      line-height: 1.7;
      font-size: 16px;
    }

    h1 {
      color: #2c3e50;
      margin: 0;
      font-size: 30px;
      font-weight: 700;
    }

    h3, h4 {
      color: #2c7a7b;
      font-weight: 500;
      line-height: 1.5;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0 auto 30px auto;
      position: relative;
    }

    .logo {
      width: 150px;
      height: 150px;
      margin-right: 20px;
    }

    .login-link {
      position: absolute;
      right: 0;
      top: 10px;
      font-size: 16px;
      color: #3498db;
      text-decoration: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .login-link:hover {
      background-color: #e6f3ff;
      text-decoration: underline;
    }

    .user-info {
      position: absolute;
      right: 0;
      top: 10px;
      font-size: 16px;
      color: #34495e;
      background-color: #e6f3ff;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #3498db;
      display: none;
      align-items: center;
    }

    .user-info.active {
      display: flex;
    }

    .user-info span {
      cursor: pointer;
      color: #3498db;
    }

    .user-info span:hover {
      text-decoration: underline;
    }

    .user-info button, .delete-course-btn {
      font-size: 16px;
      padding: 4px 8px;
      margin-left: 8px;
      background-color: #e74c3c;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .user-info button:hover, .delete-course-btn:hover {
      background-color: #c0392b;
    }

    .chat-container {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    label {
      font-weight: 500;
      margin-top: 16px;
      display: block;
      color: #34495e;
    }

    select, textarea, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }

    select:focus, textarea:focus, input:focus {
      border-color: #3498db;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    button.loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .response {
      margin-top: 30px;
      padding: 20px;
      background-color: #ecfdf5;
      border-left: 6px solid #2ecc71;
      border-radius: 12px;
    }

    .career-advice {
      margin-top: 20px;
      padding: 15px;
      background-color: #e6f3ff;
      border-left: 6px solid #3498db;
      border-radius: 8px;
    }

    .career-advice h4 {
      margin-top: 0;
      color: #1e88e5;
    }

    .loading-text {
      color: #888;
      font-style: italic;
    }

    .page {
      display: none;
    }

    .visible {
      display: block;
    }

    .followup-box {
      background: #fdf6e3;
      padding: 20px;
      margin-top: 20px;
      border-left: 6px solid #f39c12;
      border-radius: 12px;
    }

    .followup-response {
      margin-top: 12px;
      padding: 12px;
      background-color: #f0f9ff;
      border-left: 4px solid #3498db;
      border-radius: 8px;
    }

    .course-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }

    .course-table th, .course-table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    .course-table th {
      background-color: #3498db;
      color: white;
      font-weight: 500;
    }

    .course-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .course-table tr:hover {
      background-color: #e6f3ff;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      color: #34495e;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #e74c3c;
    }

    .auth-box {
      margin-top: 10px;
    }

    .auth-box input, .auth-box select {
      margin-bottom: 10px;
    }

    .history-item {
      margin-top: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border-left: 4px solid #3498db;
      border-radius: 8px;
    }

    .learning-map {
      margin-top: 20px;
      padding: 15px;
      background-color: #e6f3ff;
      border-left: 4px solid #2ecc71;
      border-radius: 8px;
    }

    .taken-courses-list {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }

    .taken-courses-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      background-color: #f9f9f9;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .taken-courses-list li:hover {
      background-color: #e6f3ff;
    }
  </style>
</head>
<body>

    <label for="takenCourses">已修課程：</label>

    <label for="studentQuestion">補充說明 / 問題描述：</label>

    <button id="submitBtn" onclick="submitInitial()">送出問題</button>

  <div id="page2" class="page chat-container">
    <h3>使用者輸入資料：</h3>
    <p id="userSummary"></p>

    <div class="response">
      <h3>AI建議回覆</h3>
      <div id="aiAdvice" class="loading-text">載入中...</div>
    </div>

    <div class="followup-box">
      <label for="followupInput">有其他想問的嗎？</label>
      <textarea id="followupInput" placeholder="請輸入追問，例如：這些課程的先修要求是什麼？"></textarea>

  <div id="page3" class="page chat-container">
    <h3>個人資料維護</h3>
    <h4>編輯個人資料</h4>
    <label for="profileDepartment">主修學系：</label>
    <select id="profileDepartment">
      <option value="">-- 請選擇 --</option>
      <option value="中國文學系">中國文學系</option>
      <option value="英美語文學系">英美語文學系</option>

      <option value="數學系">數學系</option>

      <option value="機械工程學系">機械工程學系</option>
      <option value="土木工程學系">土木工程學系</option>
      <option value="化學工程與材料工程學系">化學工程與材料工程學系</option>
      <option value="電機工程學系">電機工程學系</option>
      <option value="資訊工程學系">資訊工程學系</option>
      <option value="地球科學學系">地球科學學系</option>
      <option value="大氣科學學系">大氣科學學系</option>
      <option value="企業管理學系">企業管理學系</option>
      <option value="資訊管理學系">資訊管理學系</option>
      <option value="財務金融學系">財務金融學系</option>
      <option value="客家語文暨社會科學學系">客家語文暨社會科學學系</option>
      <option value="生物醫學工程學系">生物醫學工程學系</option>
    </select>

    <label for="profileGrade">年級：</label>
    <select id="profileGrade">
      <option value="">-- 請選擇 --</option>
      <option value="一年級">一年級</option>
      <option value="二年級">二年級</option>
      <option value="三年級">三年級</option>
      <option value="四年級">四年級</option>
      <option value="研究生">研究生</option>
    </select>

    <label for="profileTakenCourses">已修課程（輸入新課程，格式：課程名稱 (學期)）：</label>
    <input type="text" id="profileTakenCourses" placeholder="例如：程式設計 (113-2), 線性代數 (113-1)...">

    <button onclick="saveProfile()">儲存資料</button>

    <h4>歷史問題</h4>

    <button onclick="goHome()">回到首頁</button>

  <script>
    let originalQuestion = '';
    let originalAnswer = '';
    let isLoggedIn = false;

    // 檢查問題是否與課程或職涯相關
    function isQuestionRelevant(question) {
      const keywords = [
        '課程', '選課', '課', '學', '學習', '修', '職涯', '職業', '工作', 
        '規劃', '建議', '推薦', '分析', '程式', '資料', '數據', '工程', 
        '管理', '設計', '技能', '實習', '面試', '準備'
      ];
      return keywords.some(keyword => question.toLowerCase().includes(keyword));
    }

    // 開啟登入/註冊模態框
    function openLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('authUsername').value = '';
      document.getElementById('authPassword').value = '';
      document.getElementById('authError').style.display = 'none';
    }

    // 關閉登入/註冊模態框
    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target === document.getElementById('loginModal')) {
        closeLoginModal();
      }
    };

    // 檢查登入狀態
    async function checkLoginStatus() {
      try {
        const res = await fetch('http://localhost:3000/user', { 
          method: 'GET',
          credentials: 'include',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        console.log('登入狀態檢查:', data, 'Cookies:', document.cookie);

        const loginLink = document.getElementById('loginLink');
        const userInfo = document.getElementById('userInfo');
        const userUsername = document.getElementById('userUsername');
        const saveBtn = document.getElementById('saveBtn');

        if (!userInfo || !userUsername || !loginLink || !saveBtn) {
          console.error('❌ DOM 元素未找到:', { userInfo, userUsername, loginLink, saveBtn });
          return;
        }

        if (data.user_id && data.username) {
          isLoggedIn = true;
          loginLink.style.display = 'none';
          userInfo.classList.add('active');
          userUsername.innerText = data.username;
          saveBtn.style.display = 'block';
          document.getElementById('department').value = data.department || '';
          document.getElementById('grade').value = data.grade || '';
          document.getElementById('takenCourses').value = data.takenCourses || '';
          console.log(`✅ 用戶已登入，顯示 userInfo: ${data.username}`);
        } else {
          isLoggedIn = false;
          loginLink.style.display = 'block';
          userInfo.classList.remove('active');
          userUsername.innerText = '';
          saveBtn.style.display = 'none';
          console.log('⚠️ 未登入，顯示 loginLink');
        }
      } catch (err) {
        console.error('❌ 檢查登入狀態失敗:', err.message);
        document.getElementById('authError').innerText = '無法連接到伺服器，請確認後端運行並使用 http://localhost:8080';
        document.getElementById('authError').style.display = 'block';
      }
    }

    // 註冊
    async function register() {
      const username = document.getElementById('authUsername').value;
      const password = document.getElementById('authPassword').value;
      const authError = document.getElementById('authError');
      const registerBtn = document.querySelector('#loginModal button[onclick="register()"]');
      
      authError.style.display = 'none';
      registerBtn.disabled = true;
      registerBtn.classList.add('loading');

      if (!username || !password) {
        authError.innerText = '請填寫用戶名和密碼';
        authError.style.display = 'block';
        registerBtn.disabled = false;
        registerBtn.classList.remove('loading');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        console.log('註冊回應:', data);
        if (!res.ok || data.error) {
          authError.innerText = data.error || '註冊失敗，請稍後再試';
          authError.style.display = 'block';
        } else {
          authError.innerText = '註冊成功，請登入';
          authError.style.color = 'green';
          authError.style.display = 'block';
        }
      } catch (err) {
        console.error('❌ 註冊錯誤:', err.message);
        authError.innerText = '無法連接到伺服器，請確認後端運行並使用 http://localhost:8080';
        authError.style.display = 'block';
      } finally {
        registerBtn.disabled = false;
        registerBtn.classList.remove('loading');
      }
    }

    // 登入
    async function login() {
      const username = document.getElementById('authUsername').value;
      const password = document.getElementById('authPassword').value;
      const authError = document.getElementById('authError');
      const loginBtn = document.querySelector('#loginModal button[onclick="login()"]');
      
      authError.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.classList.add('loading');

      if (!username || !password) {
        authError.innerText = '請填寫用戶名和密碼';
        authError.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        console.log('登入 API 回應:', data, 'Cookies:', document.cookie);

        if (!res.ok || data.error) {
          authError.innerText = data.error || '登入失敗，請檢查用戶名或密碼';
          authError.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.classList.remove('loading');
          return;
        }

        closeLoginModal();
        await checkLoginStatus();
        authError.innerText = '登入成功！';
        authError.style.color = 'green';
        authError.style.display = 'block';
        setTimeout(() => authError.style.display = 'none', 2000);
      } catch (err) {
        console.error('❌ 登入錯誤:', err.message);
        authError.innerText = '無法連接到伺服器，請確認後端運行並使用 http://localhost:8080';
        authError.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
      }
    }

    // 登出
    async function logout() {
      try {
        const res = await fetch('http://localhost:3000/logout', { 
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
        });
        console.log('登出回應:', await res.json());
        await checkLoginStatus();
      } catch (err) {
        console.error('❌ 登出失敗:', err.message);
        document.getElementById('authError').innerText = '登出失敗，請稍後再試';
        document.getElementById('authError').style.display = 'block';
      }
    }

    // 儲存首頁用戶資料
    async function saveUserData() {
      const saveBtn = document.getElementById('saveBtn');
      const errorMsg = document.getElementById('errorMsg');
      
      saveBtn.disabled = true;
      saveBtn.classList.add('loading');
      errorMsg.style.display = 'none';

      const dept = document.getElementById('department').value;
      const grade = document.getElementById('grade').value;
      const taken = document.getElementById('takenCourses').value;

      if (!dept || !grade) {
        errorMsg.innerText = '請填寫學系和年級！';
        errorMsg.style.display = 'block';
        saveBtn.disabled = false;
        saveBtn.classList.remove('loading');
        return;
      }

      try {

        });

    // 載入已修課程清單（帶刪除按鈕）
    async function loadTakenCoursesList() {
      const takenCoursesList = document.getElementById('takenCoursesList');
      takenCoursesList.innerHTML = '<div class="loading-text">載入中...</div>';

      try {
        const res = await fetch('http://localhost:3000/user', {
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          takenCoursesList.innerHTML = `<p style="color:red;">${data.error || '載入已修課程失敗'}</p>`;
          return;
        }

        const courses = data.takenCourses ? data.takenCourses.split(',').map(c => c.trim()).filter(c => c) : [];
        if (courses.length === 0) {
          takenCoursesList.innerHTML = '<p>尚未記錄已修課程。</p>';
          return;
        }

        takenCoursesList.innerHTML = courses.map(course => {
          const match = course.match(/(.+)\s*\((.+)\)/);
          const courseName = match ? match[1].trim() : course;
          const semester = match ? match[2].trim() : '未知';
          // 使用 encodeURIComponent 避免特殊字符問題
          return `
            <li>
              ${course}
              <button class="delete-course-btn" onclick="deleteCourse('${encodeURIComponent(courseName)}', '${encodeURIComponent(semester)}')">刪除</button>
            </li>
          `;
        }).join('');
      } catch (err) {
        console.error('❌ 載入已修課程錯誤:', err.message);
        takenCoursesList.innerHTML = '<p style="color:red;">無法連接到伺服器，請確認後端運行並使用 http://localhost:8080</p>';
      }
    }

    // 刪除課程
    async function deleteCourse(encodedCourseName, encodedSemester) {
      const courseName = decodeURIComponent(encodedCourseName);
      const semester = decodeURIComponent(encodedSemester);
      const errorMsg = document.getElementById('profileError');
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('http://localhost:3000/delete-course', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ courseName, semester })
        });

        const data = await res.json();
        console.log('刪除課程回應:', data);

        if (!res.ok || data.error) {
          errorMsg.innerText = data.error || '刪除課程失敗';
          errorMsg.style.display = 'block';
        } else {
          errorMsg.innerText = '課程已刪除！';
          errorMsg.style.color = 'green';
          errorMsg.style.display = 'block';
          // 更新清單和輸入框
          await loadTakenCoursesList();
          await loadLearningMap();
          const currentCourses = document.getElementById('profileTakenCourses').value
            .split(',')
            .map(c => c.trim())
            .filter(c => c && !c.includes(`${courseName} (${semester})`))
            .join(', ');
          document.getElementById('profileTakenCourses').value = currentCourses;
          document.getElementById('takenCourses').value = currentCourses;
        }
      } catch (err) {
        console.error('❌ 刪除課程錯誤:', err.message);
        errorMsg.innerText = '無法連接到伺服器，請確認後端運行並使用 http://localhost:8080';
        errorMsg.style.display = 'block';
      }
    }

    // 載入歷史問題
    async function loadHistory() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '<div class="loading-text">載入中...</div>';

      try {
        const res = await fetch('http://localhost:3000/history', {
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          historyList.innerHTML = `<p style="color:red;">${data.error || '載入歷史問題失敗'}</p>`;
          return;
        }

        if (data.length === 0) {
          historyList.innerHTML = '<p>尚無歷史問題記錄。</p>';
          return;
        }

        historyList.innerHTML = data.map(item => {
          let responseContent = '無回應內容';
          try {
            const response = JSON.parse(item.response);
            responseContent = Array.isArray(response.advice.content)
              ? `<ul>${response.advice.content.map(c => `<li>${c}</li>`).join('')}</ul>`
              : `<p>${response.advice.content}</p>`;
          } catch (e) {
            console.error('❌ 解析歷史回應失敗:', e);
          }
          return `
            <div class="history-item">
              <p><strong>問題：</strong> ${item.question}</p>
              <p><strong>時間：</strong> ${new Date(item.timestamp).toLocaleString('zh-TW')}</p>
              <p><strong>回應：</strong> ${responseContent}</p>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('❌ 載入歷史問題錯誤:', err.message);
        historyList.innerHTML = '<p style="color:red;">無法連接到伺服器，請確認後端運行並使用 http://localhost:8080</p>';
      }
    }

    // 載入學習地圖
    async function loadLearningMap() {
      const learningMap = document.getElementById('learningMap');
      learningMap.innerHTML = '<div class="loading-text">載入中...</div>';

      try {
        const res = await fetch('http://localhost:3000/user', { 
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          learningMap.innerHTML = `<p style="color:red;">${data.error || '載入學習地圖失敗'}</p>`;
          return;
        }

        const courses = data.takenCourses ? data.takenCourses.split(',').map(c => c.trim()).filter(c => c) : [];
        learningMap.innerHTML = `
          <p><strong>已修課程：</strong></p>
          ${courses.length > 0 
            ? `<ul class="taken-courses-list">${courses.map(c => `<li>${c}</li>`).join('')}</ul>`
            : '<p>尚未記錄已修課程。</p>'}
          <p>（未來可視化為課程進度圖或學習路徑）</p>
        `;
      } catch (err) {
        console.error('❌ 載入學習地圖錯誤:', err.message);
        learningMap.innerHTML = '<p style="color:red;">無法連接到伺服器，請確認後端運行並使用 http://localhost:8080</p>';
      }
    }

    // 切換頁面
    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('visible'));
      document.getElementById(pageId).classList.add('visible');
    }

    // 進入個人資料頁面
    async function goToProfile() {
      switchPage('page3');
      try {
        const userData = await (await fetch('http://localhost:3000/user', { 
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        })).json();
        document.getElementById('profileDepartment').value = userData.department || '';
        document.getElementById('profileGrade').value = userData.grade || '';
        document.getElementById('profileTakenCourses').value = userData.takenCourses || '';
        await loadTakenCoursesList();
        await loadHistory();
        await loadLearningMap();
      } catch (err) {
        console.error('❌ 載入個人資料失敗:', err.message);
        document.getElementById('profileError').innerText = '無法連接到伺服器，請確認後端運行並使用 http://localhost:8080';
        document.getElementById('profileError').style.display = 'block';
      }
    }

    // 提交初始問題
    async function submitInitial() {
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      const dept = document.getElementById('department').value;
      const grade = document.getElementById('grade').value;
      const taken = document.getElementById('takenCourses').value;
      const question = document.getElementById('studentQuestion').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      if (!isQuestionRelevant(question)) {
        errorMsg.innerText = '請問與課程或職涯相關的問題';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            department: dept,
            grade: grade,
            takenCourses: taken,
            question: question,
            isFollowup: false
          })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          errorMsg.innerText = data.error || '發生錯誤，無法處理問題。請稍後再試。';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          return;
        }

        originalQuestion = question;
        originalAnswer = JSON.stringify(data.response);

        document.getElementById('userSummary').innerText =
          `主修學系：${dept || '未提供'}\n年級：${grade || '未提供'}\n已修課程：${taken || '未提供'}\n補充說明：${question}`;
        
        document.getElementById('aiAdvice').innerHTML = `
          <div class="career-advice">
            <h4>${data.response.title || '職涯建議'}</h4>
            ${Array.isArray(data.response.content) 
              ? `<ul>${data.response.content.map(item => `<li>${item}</li>`).join('')}</ul>` 
              : `<p>${data.response.content}</p>`}
          </div>
          ${data.courses?.length > 0 ? `
            <h4>推薦課程</h4>
            <table class="course-table">
              <tr>
                <th>課程名稱</th>
                <th>課程內容</th>
                <th>學分數</th>
                <th>課程類型</th>
                <th>推薦原因</th>
              </tr>
              ${data.courses.map(c => `
                <tr>
                  <td>${c.course_name}</td>
                  <td>${c.description}</td>
                  <td>${c.credits}</td>
                  <td>${c.course_type}</td>
                  <td>${c.reason}</td>
                </tr>
              `).join('')}
            </table>
          ` : ''}
          ${data.message ? `<p>${data.message}</p>` : ''}
        `;

        switchPage('page2');
      } catch (err) {
        console.error('❌ 提交問題錯誤:', err.message);
        errorMsg.innerText = '無法連接到伺服器，請確認後端運行並使用 http://localhost:8080';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    }

    // 提交追問
    async function sendFollowup() {
      const followupBtn = document.getElementById('followupBtn');
      followupBtn.disabled = true;
      followupBtn.classList.add('loading');

      const followupInput = document.getElementById('followupInput').value;
      const resultDiv = document.getElementById('followupResult');
      const errorMsg = document.getElementById('errorMsg');
      resultDiv.style.display = 'block';
      resultDiv.innerText = 'AI 思考中...';
      errorMsg.style.display = 'none';

      if (!isQuestionRelevant(followupInput)) {
        resultDiv.innerText = '請問與課程或職涯相關的問題';
        followupBtn.disabled = false;
        followupBtn.classList.remove('loading');
        return;
      }

      if (!originalAnswer) {
        resultDiv.innerText = '請先提交初始問題，再進行追問！';
        followupBtn.disabled = false;
        followupBtn.classList.remove('loading');
        return;
      }
      if (!followupInput) {
        resultDiv.innerText = '請輸入追問內容！';
        followupBtn.disabled = false;
        followupBtn.classList.remove('loading');
        return;
      }

      const dept = document.getElementById('department').value;
      const grade = document.getElementById('grade').value;
      const taken = document.getElementById('takenCourses').value;

      try {
        const res = await fetch('http://localhost:3000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            department: dept,
            grade: grade,
            takenCourses: taken,
            question: originalQuestion,
            followupQuestion: followupInput,
            previousAnswer: originalAnswer,
            isFollowup: true
          })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          resultDiv.innerText = data.error || '發生錯誤，請稍後再試。';
          followupBtn.disabled = false;
          followupBtn.classList.remove('loading');
          return;
        }

        resultDiv.innerHTML = `
          <div class="career-advice">
            <h4>${data.followupResult.title || '追問回應'}</h4>
            ${Array.isArray(data.followupResult.content) 
              ? `<ul>${data.followupResult.content.map(item => `<li>${item}</li>`).join('')}</ul>` 
              : `<p>${data.followupResult.content}</p>`}
          </div>
        `;
      } catch (err) {
        console.error('❌ 提交追問錯誤:', err.message);
        resultDiv.innerText = '無法連接到伺服器，請確認後端運行並使用 http://localhost:8080';
      } finally {
        followupBtn.disabled = false;
        followupBtn.classList.remove('loading');
      }
    }

    // 返回首頁
    function goHome() {
      document.getElementById('followupInput').value = '';
      document.getElementById('followupResult').style.display = 'none';
      document.getElementById('followupResult').innerText = '';
      switchPage('page1');
      checkLoginStatus();
    }

    window.onload = checkLoginStatus;
  </script>
